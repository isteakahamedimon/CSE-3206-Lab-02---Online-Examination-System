{% extends "layout.html" %}
{% block title %}Login - Online Exam System{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md border border-gray-150 mt-10">
    <h2 class="text-2xl font-bold text-center text-indigo-600 mb-6">User Sign In</h2>
    <form action="{{ url_for('login') }}" method="POST" class="space-y-4">
        <div>
            <label for="email" class="block text-sm font-semibold text-gray-700 mb-1">Email Address</label>
            <input type="email" name="email" id="email" required 
                   class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500 text-sm">
        </div>
        <div>
            <label for="password" class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
            <input type="password" name="password" id="password" required 
                   class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500 text-sm">
        </div>
        <button type="submit" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-md transition text-sm">
            Sign In
        </button>
    </form>
    <p class="text-center text-xs text-gray-500 mt-6">
        Don't have an account? <a href="{{ url_for('register') }}" class="text-indigo-600 hover:underline font-medium">Register here</a>.
    </p>
</div>
{% endblock %}
