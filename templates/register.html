{% extends "layout.html" %}
{% block title %}Register - Online Exam System{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md border border-gray-150 mt-6">
    <h2 class="text-2xl font-bold text-center text-indigo-600 mb-6">Create Account</h2>
    <form action="{{ url_for('register') }}" method="POST" class="space-y-4">
        <div>
            <label for="name" class="block text-sm font-semibold text-gray-700 mb-1">Full Name</label>
            <input type="text" name="name" id="name" required 
                   class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500 text-sm">
        </div>
        <div>
            <label for="email" class="block text-sm font-semibold text-gray-700 mb-1">Email Address</label>
            <input type="email" name="email" id="email" required 
                   class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500 text-sm">
        </div>
        <div>
            <label for="password" class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
            <input type="password" name="password" id="password" required 
                   class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500 text-sm">
        </div>
        <div>
            <label for="role" class="block text-sm font-semibold text-gray-700 mb-1">Account Role</label>
            <select name="role" id="role" required onchange="toggleRoleFields()"
                    class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                <option value="student">Student (Examinee)</option>
                <option value="teacher">Teacher (Examiner)</option>
            </select>
        </div>
        <div id="student-fields">
            <label for="roll" class="block text-sm font-semibold text-gray-700 mb-1">Student Roll Number</label>
            <input type="text" name="roll" id="roll" placeholder="e.g. 2203013"
                   class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500 text-sm">
        </div>
        <div id="teacher-fields" class="hidden">
            <label for="teacher_uid" class="block text-sm font-semibold text-gray-700 mb-1">Teacher Code ID</label>
            <input type="text" name="teacher_uid" id="teacher_uid" placeholder="e.g. T-104"
                   class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500 text-sm">
        </div>
        <div>
            <label for="department" class="block text-sm font-semibold text-gray-700 mb-1">Academic Department</label>
            <select name="department" id="department" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                <option value="CSE">CSE (Computer Science & Eng.)</option>
                <option value="EEE">EEE (Electrical & Electronic Eng.)</option>
                <option value="ME">ME (Mechanical Engineering)</option>
                <option value="CE">CE (Civil Engineering)</option>
            </select>
        </div>

        <script>
            function toggleRoleFields() {
                var role = document.getElementById("role").value;
                if (role === "student") {
                    document.getElementById("student-fields").classList.remove("hidden");
                    document.getElementById("teacher-fields").classList.add("hidden");
                    document.getElementById("roll").required = true;
                    document.getElementById("teacher_uid").required = false;
                } else {
                    document.getElementById("student-fields").classList.add("hidden");
                    document.getElementById("teacher-fields").classList.remove("hidden");
                    document.getElementById("roll").required = false;
                    document.getElementById("teacher_uid").required = true;
                }
            }
            // run initialization on page load
            toggleRoleFields();
        </script>
        <button type="submit" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-md transition text-sm">
            Register Account
        </button>
    </form>
    <p class="text-center text-xs text-gray-500 mt-6">
        Already have an account? <a href="{{ url_for('login') }}" class="text-indigo-600 hover:underline font-medium">Login here</a>.
    </p>
</div>
{% endblock %}
